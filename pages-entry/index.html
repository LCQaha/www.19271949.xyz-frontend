      body { margin:0; background:#f8f9f6; color:var(--ink); font-family:Inter,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }

      .destination:hover { transform:translate(-2px,-2px); box-shadow:7px 7px 0 var(--ink); }
      .destination small { display:block; font-size:14px; margin-bottom:8px; }
      .destination strong { font:700 clamp(20px,4vw,32px)/1.3 Consolas,monospace; letter-spacing:-.03em; overflow-wrap:anywhere; }
      .arrow { font-size:32px; flex-shrink:0; }
      .links { display:flex; align-items:center; gap:24px; flex-wrap:wrap; margin-top:30px; font-size:14px; }
      .links a { display:inline-flex; align-items:center; gap:8px; padding:8px 0; }
      .links a:hover { text-decoration:underline; text-underline-offset:5px; }
      .links img { width:19px; height:19px; }
      footer { display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; padding:24px 0; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }
      @media(max-width:480px) { .destination { padding:22px 18px; } header>.small { display:none; } main { padding:48px 0; } }

# Include INSIDE the server block whose root points to the deployed www/dist.
# Keep the server's existing listen, TLS certificates and server_name settings.
# Replace conflicting old location blocks; do not append duplicate locations.

error_page 404 /404.html;

location = / {
    try_files /index.html =404;
    add_header Cache-Control "no-cache" always;
}

location = /index.html {
    error_page 404 =404 @frontend_404;
    # Windows matches literal locations without case sensitivity. Vue does not.
    if ($uri != /index.html) { return 404; }
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
}

location = /404.html {
    internal;
    add_header Cache-Control "no-store" always;
}

location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location ^~ /icons/ {
    try_files $uri =404;
}

location / {
    # Render the Vue catch-all without rewriting the browser URL or returning 200.
    error_page 404 =404 @frontend_404;
    try_files $uri =404;
}

location @frontend_404 {
    try_files /index.html =404;
    add_header Cache-Control "no-cache" always;
}

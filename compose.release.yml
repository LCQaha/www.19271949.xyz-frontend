services:
  www:
    image: nginx:1.30.4-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - type: bind
        source: ./release/${SITE_VERSION:?Set SITE_VERSION in .env.release}
        target: /usr/share/nginx/html
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./deploy/nginx/www.container.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./deploy/nginx/www.locations.conf
        target: /etc/nginx/snippets/www.locations.conf
        read_only: true
        bind:
          create_host_path: false
